name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck nftables squid-openssl python3
      - name: ShellCheck
        run: make lint
      - name: Unit tests (unprivileged)
        run: ./tests/run.sh
      - name: Unit tests (root - nft and squid validation)
        run: sudo -E ./tests/run.sh
