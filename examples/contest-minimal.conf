# =============================================================================
# Example contest.conf: a lean, ICPC-like machine.
#   - only Firefox (no Chrome), only Code::Blocks + Geany + vim (no VS Code /
#     Sublime), offline docs yes.
#
# Copy to /etc/contest-env/contest.conf BEFORE running 'sudo cmanager setup'.
# (Software that is already installed is not removed.)
# =============================================================================

CONTEST_USER="participant"

PROXY_PORT=3128
SNI_ENFORCE=auto
DENY_DNS=1

BLOCK_USB_STORAGE=1
BLOCK_MTP=1
BLOCK_OPTICAL_AND_MOUNTS=1
BLOCK_BLUETOOTH=1
BLOCK_AI_APPS=1

INSTALL_CHROME=0
INSTALL_FIREFOX=1
INSTALL_VSCODE=0
INSTALL_SUBLIME=0
INSTALL_CODEBLOCKS=1
INSTALL_GEANY=1
INSTALL_OFFLINE_DOCS=1
EXTRA_PACKAGES="emacs"

VSCODE_EXTENSIONS=""
DISABLE_AUTO_UPDATES=1
