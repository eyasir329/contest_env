# =============================================================================
# contest-env main configuration  (/etc/contest-env/contest.conf)
# Shell syntax: KEY=value. Re-run 'sudo cmanager restrict' after changes.
# =============================================================================

# Account used by contestants. Every command defaults to this user.
CONTEST_USER="participant"

# ---- Network ---------------------------------------------------------------
# Local allowlist proxy port (listens on 127.0.0.1 only).
PROXY_PORT=3128

# Check the TLS SNI name as well as the CONNECT host (needs squid-openssl).
#   auto = on when Squid supports it, yes = require it, no = off.
SNI_ENFORCE=auto

# Refuse all DNS for the contest user. Name resolution happens inside the
# proxy, so browsers keep working; DNS tunnels (e.g. "LLM over DNS") don't.
DENY_DNS=1

# ---- Devices & apps (applied by 'restrict', undone by 'unrestrict') --------
BLOCK_USB_STORAGE=1          # USB sticks/disks, SD-card readers on USB
BLOCK_MTP=1                  # phones/cameras (MTP/PTP), incl. file transfer
BLOCK_OPTICAL_AND_MOUNTS=1   # CD/DVD and any mounting by the contest user
BLOCK_BLUETOOTH=1            # stops bluetooth.service during the contest
BLOCK_AI_APPS=1              # deny execution of apps in blocked-apps.txt

# ---- Software installed by 'setup' -----------------------------------------
INSTALL_CHROME=1             # Google Chrome (amd64 only)
INSTALL_FIREFOX=1
INSTALL_VSCODE=1
INSTALL_SUBLIME=1
INSTALL_CODEBLOCKS=1
INSTALL_GEANY=1
INSTALL_OFFLINE_DOCS=1       # cppreference + Python docs, usable offline
EXTRA_PACKAGES=""            # e.g. "emacs kate"

# VS Code extensions installed for the contest user (IDs, space separated).
# No AI extensions here - and AI features are disabled in settings anyway.
VSCODE_EXTENSIONS="ms-vscode.cpptools ms-python.python redhat.java"

# Stop apt/snap background updates (a Firefox snap refresh mid-contest
# closes the browser).
DISABLE_AUTO_UPDATES=1
