# contest-env logs (installed as /etc/logrotate.d/contest-env)
/var/log/contest-env/proxy/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    su proxy proxy
}
/var/log/contest-env/cmanager.log {
    monthly
    rotate 12
    compress
    missingok
    notifempty
}
